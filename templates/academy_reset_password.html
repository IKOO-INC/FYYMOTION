{% extends "academy_auth_base.html" %}
{% block title %}Buat Password Baru — FYY MOTION Academy{% endblock %}
{% block subtitle %}Buat password baru untuk {{ email }}{% endblock %}
{% block auth_content %}
<form method="post" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3">
    <label class="form-label fw-bold small">Password Baru</label>
    <div class="input-group"><span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
      <input name="password" type="password" class="form-control" required minlength="6" maxlength="128" autofocus placeholder="Minimal 6 karakter"></div>
  </div>
  <div class="mb-3">
    <label class="form-label fw-bold small">Konfirmasi Password Baru</label>
    <div class="input-group"><span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
      <input name="confirm_password" type="password" class="form-control" required minlength="6" maxlength="128" placeholder="Ulangi password baru"></div>
  </div>
  <button class="btn btn-primary w-100 fw-bold" type="submit"><i class="fa-solid fa-floppy-disk"></i> Simpan Password Baru</button>
</form>
{% endblock %}
